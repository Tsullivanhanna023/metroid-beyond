name: Publish verified browser game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out release
        uses: actions/checkout@v6
      - name: Set up integrity checker
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact release and Pages paths
        run: node scripts/verify.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
